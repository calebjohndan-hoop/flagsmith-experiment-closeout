name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the offline test suite
        run: python -m unittest discover tests -v

  oldest-python:
    name: tests (ubuntu-latest, Python 3.9, oldest supported)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv (it can still fetch Python 3.9)
        run: python -m pip install uv
      - name: Run the offline test suite on Python 3.9
        run: uv run --no-project --python 3.9 python -m unittest discover tests -v

  validate:
    name: lint and Agent Skills spec check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install checkers
        run: python -m pip install pyflakes skills-ref
      - name: Lint
        run: python -m pyflakes skills demo tests
      - name: Validate the skill against the Agent Skills spec
        run: agentskills validate skills/flagsmith-experiment-closeout
